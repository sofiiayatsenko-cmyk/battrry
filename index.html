<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1158ff">
<title>Charge Battery</title>
<style>
  :root{ --item-size:46px; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden;touch-action:manipulation;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}

  /* Яркий анимированный фон */
  body{background:#1158ff}
  .bg{position:fixed;inset:-20%;z-index:0;
    background:
      radial-gradient(40% 35% at 20% 25%, #3ea8ff 0%, transparent 70%),
      radial-gradient(45% 40% at 80% 30%, #00d4ff 0%, transparent 70%),
      radial-gradient(50% 45% at 70% 80%, #1e5bff 0%, transparent 70%),
      radial-gradient(45% 40% at 20% 85%, #0a3bd6 0%, transparent 70%),
      linear-gradient(135deg,#1a6dff,#0b3fe0 50%,#00a2ff);
    filter:saturate(1.25);animation:bg 12s ease-in-out infinite alternate}
  @keyframes bg{0%{transform:rotate(0) scale(1)}50%{transform:rotate(8deg) scale(1.1)}100%{transform:rotate(-6deg) scale(1.05)}}

  #stage{position:fixed;inset:0;z-index:1}

  .title{position:absolute;left:0;right:0;top:calc(7% + env(safe-area-inset-top));text-align:center;
    font-size:22px;font-weight:800;letter-spacing:.3px;text-shadow:0 2px 12px rgba(0,0,0,.25);transition:opacity .4s}
  .title small{display:block;font-size:14px;font-weight:600;opacity:.85;margin-top:6px}
  .done .title{opacity:0}

  /* Батарейка */
  .battery-wrap{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(1);
    display:flex;flex-direction:column;align-items:center;gap:10px;z-index:1;
    transition:top .8s cubic-bezier(.2,.9,.25,1),transform .8s cubic-bezier(.2,.9,.25,1)}
  .battery{position:relative;width:140px;height:66px;border:3.5px solid #fff;border-radius:15px;padding:5px;
    background:rgba(0,0,0,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .battery::after{content:"";position:absolute;right:-11px;top:50%;transform:translateY(-50%);
    width:7px;height:24px;background:#fff;border-radius:0 4px 4px 0}
  .fill{height:100%;width:10%;border-radius:9px;
    background:linear-gradient(90deg,#ff2d2d 0%,#ff8a00 30%,#ffd400 55%,#7ed321 80%,#2ecc71 100%);
    box-shadow:0 0 14px rgba(255,230,0,.55);
    transition:width .35s cubic-bezier(.3,1.4,.5,1)}
  .battery.bump{animation:bump .25s}
  @keyframes bump{50%{transform:scale(1.07)}}
  .pct{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,0,0,.3)}
  .done .battery-wrap{top:48%;transform:translate(-50%,-50%) scale(1.75)}
  .done .battery{animation:glow 1.4s ease-in-out infinite alternate}
  @keyframes glow{to{box-shadow:0 0 40px rgba(120,255,140,.8)}}

  /* Летающие предметы */
  .item{position:absolute;left:0;top:0;width:var(--item-size);height:var(--item-size);z-index:2;cursor:pointer;will-change:transform}
  .item::before{content:"";position:absolute;inset:-14px}           /* увеличенная зона тапа */
  .item svg{width:100%;height:100%;display:block;pointer-events:none;
    filter:drop-shadow(0 0 8px var(--glow)) drop-shadow(0 3px 4px rgba(0,0,0,.25));
    animation:wob 1.2s ease-in-out infinite alternate}
  @keyframes wob{from{transform:rotate(-12deg) scale(.95)}to{transform:rotate(12deg) scale(1.05)}}
  .badge{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);pointer-events:none;
    background:#fff;color:#0b3fe0;font-size:12px;font-weight:900;line-height:1;padding:3px 6px;border-radius:9px;
    box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap;font-variant-numeric:tabular-nums}
  .item.big .badge{background:#ffd400;color:#111}
  .item.in{animation:in .3s ease-out}
  @keyframes in{from{opacity:0;scale:.2}to{opacity:1;scale:1}}

  .ring{position:absolute;width:var(--item-size);height:var(--item-size);border-radius:50%;
    border:3px solid var(--c);pointer-events:none;z-index:2;animation:ring .45s ease-out forwards}
  @keyframes ring{from{transform:scale(.5);opacity:1}to{transform:scale(1.9);opacity:0}}
  .spark{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--c);pointer-events:none;z-index:2;
    animation:spark .5s ease-out forwards}
  @keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  .plus{position:absolute;font-weight:800;font-size:17px;color:#fff;pointer-events:none;z-index:3;
    text-shadow:0 0 8px var(--c),0 2px 4px rgba(0,0,0,.3);animation:plus .7s ease-out forwards}
  @keyframes plus{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-44px);opacity:0}}

  /* CTA (опционально) */
  .cta{position:absolute;left:50%;bottom:calc(13% + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    opacity:0;pointer-events:none;transition:.5s .6s;white-space:nowrap;text-decoration:none;
    background:#fff;color:#1158ff;border-radius:16px;padding:17px 38px;font-size:18px;font-weight:800;
    box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .done .cta.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
</style>
</head>
<body>
<div class="bg"></div>
<div id="stage">
  <div class="title" id="title">Catch the bolts!<small>Tap to charge your battery</small></div>
  <div class="battery-wrap">
    <div class="battery" id="battery"><div class="fill" id="fill"></div></div>
    <div class="pct" id="pct">10%</div>
  </div>
  <a class="cta" id="cta" href="#">Continue</a>
</div>

<script>
/* ===== НАСТРОЙКИ ===== */
const CONFIG = {
  item: 'mix',          // что ловим: 'bolt' (молния) | 'battery' (батарейка) | 'mix' (вперемешку)
  title: 'Catch the bolts!',
  subtitle: 'Tap to charge your battery',   // '' = без заголовка: title: ''
  start: 10,            // стартовый заряд, %
  values: [3, 5, 7, 9, 12, 15],   // сколько % может дать предмет — выбирается случайно, цифра видна на предмете
  bigFrom: 12,          // от этого значения бейдж жёлтый (крупный приз)
  onScreen: 3,          // сколько предметов одновременно
  speed: [50, 100],     // скорость, px/сек
  ctaUrl: '',           // ссылка для кнопки после 100% ('' = кнопки нет)
  ctaText: 'Continue',
  autoRedirectMs: 0     // авто-редирект через N мс после 100% (0 = выкл)
};

/* SVG-иконки */
const BOLT = (c1,c2,id)=>`<svg viewBox="0 0 48 48"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
  <path d="M28 3 8 27h13l-4 18 23-27H26l2-15z" fill="url(#${id})" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
const MINI_BATTERY = (c1,c2,id)=>`<svg viewBox="0 0 48 48"><defs><linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0">
  <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
  <rect x="18" y="3" width="12" height="6" rx="2" fill="#fff"/>
  <rect x="10" y="8" width="28" height="37" rx="6" fill="rgba(0,0,0,.25)" stroke="#fff" stroke-width="3"/>
  <rect x="14.5" y="12.5" width="19" height="28" rx="3" fill="url(#${id})"/>
  <path d="M26 15 18 28h5l-2 9 8-12h-5l2-10z" fill="#fff"/></svg>`;

const PALETTE = {
  bolt:    [['#fff36b','#ffb300','#ffd400'], ['#fff6a0','#ff7a00','#ffae00'], ['#ffffff','#ffe46b','#ffffff']],
  battery: [['#2ecc71','#b6ff6b','#6dff8a'], ['#7ed321','#e9ff6b','#c8ff3d']]
};

const stage = document.getElementById('stage');
const fill  = document.getElementById('fill');
const pct   = document.getElementById('pct');
const cta   = document.getElementById('cta');
const bat   = document.getElementById('battery');
const titleEl = document.getElementById('title');
const SIZE  = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--item-size'));
let level = CONFIG.start, items = [], finished = false, last = performance.now(), uid = 0;

if (CONFIG.title) titleEl.innerHTML = CONFIG.title + (CONFIG.subtitle ? `<small>${CONFIG.subtitle}</small>` : '');
else titleEl.remove();
if (CONFIG.ctaUrl){ cta.href = CONFIG.ctaUrl; cta.textContent = CONFIG.ctaText; cta.classList.add('on'); }

const rand = (a,b)=>a+Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const W = ()=>innerWidth, H = ()=>innerHeight;

function render(){ fill.style.width = level + '%'; pct.textContent = level + '%'; }

function spawn(){
  const kind = CONFIG.item === 'mix' ? pick(['bolt','bolt','battery']) : CONFIG.item;
  const [c1,c2,glow] = pick(PALETTE[kind]);
  const el = document.createElement('div');
  el.className = 'item in';
  el.style.setProperty('--glow', glow);
  el.innerHTML = (kind === 'bolt' ? BOLT : MINI_BATTERY)(c1, c2, 'g' + (uid++));
  const value = pick(CONFIG.values);
  el.insertAdjacentHTML('beforeend', `<span class="badge">+${value}%</span>`);
  if (value >= CONFIG.bigFrom) el.classList.add('big');
  const ang = rand(0, Math.PI*2), sp = rand(...CONFIG.speed);
  const d = { el, color: glow, value,
    x: rand(10, W()-SIZE-10), y: rand(H()*0.12, H()*0.7),
    vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp, turn: rand(-0.8,0.8) };
  el.addEventListener('pointerdown', e => { e.preventDefault(); hit(d); });
  stage.appendChild(el); items.push(d); place(d);
}

function place(d){ d.el.style.transform = `translate(${d.x}px,${d.y}px)`; }

function hit(d){
  if (finished) return;
  items = items.filter(x => x !== d); d.el.remove();
  fx(d);
  if (navigator.vibrate) navigator.vibrate(15);
  level = Math.min(100, level + d.value);
  render();
  bat.classList.remove('bump'); void bat.offsetWidth; bat.classList.add('bump');
  if (level >= 100) return finish();
  setTimeout(spawn, rand(80, 300));
}

function fx(d){
  const cx = d.x + SIZE/2, cy = d.y + SIZE/2;
  const add = (cls, css, ms, text) => { const e = document.createElement('div'); e.className = cls;
    e.style.cssText = css; e.style.setProperty('--c', d.color); if (text) e.textContent = text;
    stage.appendChild(e); setTimeout(()=>e.remove(), ms); return e; };
  add('ring', `left:${d.x}px;top:${d.y}px`, 500);
  for (let i=0;i<8;i++){ const a = i/8*Math.PI*2, r = rand(30,50);
    const s = add('spark', `left:${cx-3}px;top:${cy-3}px`, 550);
    s.style.setProperty('--dx', Math.cos(a)*r+'px'); s.style.setProperty('--dy', Math.sin(a)*r+'px'); }
  add('plus', `left:${cx}px;top:${d.y-8}px`, 750, '+' + d.value + '%');
}

function finish(){
  finished = true;
  items.forEach(d => { d.el.style.transition='opacity .3s, scale .3s'; d.el.style.opacity=0; d.el.style.scale=.3; setTimeout(()=>d.el.remove(),300); });
  items = [];
  document.body.classList.add('done');
  if (navigator.vibrate) navigator.vibrate([30,60,30]);
  if (CONFIG.ctaUrl && CONFIG.autoRedirectMs) setTimeout(()=>location.href = CONFIG.ctaUrl, CONFIG.autoRedirectMs);
}

function tick(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  const minY = H()*0.1, maxY = H()*0.8 - SIZE;
  for (const d of items){
    const a = d.turn*dt, c = Math.cos(a), s = Math.sin(a);
    [d.vx, d.vy] = [d.vx*c - d.vy*s, d.vx*s + d.vy*c];
    if (Math.random() < 0.01) d.turn = rand(-0.9,0.9);
    d.x += d.vx*dt; d.y += d.vy*dt;
    if (d.x < 0){ d.x=0; d.vx=Math.abs(d.vx); }
    if (d.x > W()-SIZE){ d.x=W()-SIZE; d.vx=-Math.abs(d.vx); }
    if (d.y < minY){ d.y=minY; d.vy=Math.abs(d.vy); }
    if (d.y > maxY){ d.y=maxY; d.vy=-Math.abs(d.vy); }
    place(d);
  }
  requestAnimationFrame(tick);
}

render();
for (let i=0;i<CONFIG.onScreen;i++) spawn();
requestAnimationFrame(tick);
</script>
</body>
</html>
